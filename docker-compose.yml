services:
  claude-code:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: claude-code
    # Passed to the container at runtime; the entrypoint uses these to
    # configure git, so the token never gets baked into an image layer.
    environment:
      - GIT_USER_NAME=${GIT_USER_NAME}
      - GIT_USER_EMAIL=${GIT_USER_EMAIL}
      - GH_USER=${GH_USER}
      - GH_TOKEN=${GH_TOKEN}
    working_dir: /workspace
    volumes:
      # Your project code — edits Claude makes here show up on your host too
      - .:/workspace
      # Persist Claude Code's login/config across container rebuilds.
      # Reuses your host login if you've already run `claude` locally;
      # otherwise it'll prompt you to log in once inside the container.
      - ~/.claude:/root/.claude
      - ~/.claude.json:/root/.claude.json
    stdin_open: true   # keep STDIN open for interactive prompts
    tty: true           # allocate a pseudo-TTY so the CLI renders properly
